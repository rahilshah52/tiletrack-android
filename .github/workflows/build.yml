name: Build TileTrack APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make the icons and the ring sound
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin ffmpeg >/dev/null
          python3 tools/make_assets.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The existing TileTrack signing key comes from the repository secrets (Settings → Secrets and variables → Actions).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No KEYSTORE_BASE64 secret: building a TEST app that cannot update the installed TileTrack."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: tilestock
        # assembleRelease = the .apk people sideload; bundleRelease = the .aab you upload to the Play Store.
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      # Must be signed with the same key as the installed app, otherwise phones refuse the update.
      - name: Check the signing key
        if: env.KEYSTORE_FILE != ''
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-256 digest: efbc5ff66318fc00772992d51ad5bc7bae0ac41f7a1a956e1c907f1892e198c4" certs.txt \
            || { echo "::error::Wrong signing key: this APK would not install over TileTrack."; exit 1; }

      - name: Name the files and show what is inside
        run: |
          cp app/build/outputs/apk/release/*.apk TileTrack.apk
          cp app/build/outputs/bundle/release/*.aab TileTrack.aab 2>/dev/null || true
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$AAPT" dump badging TileTrack.apk | grep -E "^package|sdkVersion|uses-permission|launchable" || true
          unzip -l TileTrack.apk | grep -E "res/raw|AndroidManifest" || true
          sha256sum TileTrack.apk
          ls -la TileTrack.aab 2>/dev/null && echo "App Bundle ready for the Play Store." || echo "::warning::No .aab produced."

      # Direct download link: https://github.com/<owner>/<repo>/releases/latest/download/TileTrack.apk
      # The .aab (TileTrack.aab) on the same release is the file to upload to the Play Store.
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNED=$([ -n "$KEYSTORE_FILE" ] && echo "signed with the TileTrack key" || echo "TEST build, not signed with the TileTrack key")
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          FILES="TileTrack.apk"; [ -f TileTrack.aab ] && FILES="$FILES TileTrack.aab"
          gh release create latest $FILES --title "TileTrack Android app (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }} — $SIGNED. .apk = sideload/update; .aab = Play Store upload." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: TileTrack-app
          path: |
            TileTrack.apk
            TileTrack.aab
          retention-days: 30
